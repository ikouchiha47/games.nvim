<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku BILP Solver</title>
    <script type="module" crossorigin src="/games.nvim/assets/index-CkmQ3XEy.js"></script>
    <link rel="stylesheet" crossorigin href="/games.nvim/assets/index-bx0xF9P_.css">
  </head>
  <body>
    <div class="container">
      <h1>Sudoku — BILP Solver Demo</h1>
      <p class="subtitle">
        Puzzles generated by backtracking, then solved with
        <strong>Binary Integer Linear Programming</strong> (GLPK.js).
      </p>

      <div id="status" class="status">Loading solver…</div>

      <div id="grid" class="grid"></div>

      <div class="controls">
        <button id="generate" disabled>Generate New Puzzle</button>
        <button id="show-solution" disabled>Show Solution</button>
        <button id="hide-solution" disabled>Hide Solution</button>
      </div>

      <div class="info">
        <span id="clue-count"></span>
        <span id="solve-time"></span>
      </div>
    </div>

  </body>
</html>
