<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#2563eb" />
    <title>Sudoku BILP Solver</title>
    <link rel="icon" type="image/svg+xml" href="/games.nvim/icon.svg" />
    <link rel="apple-touch-icon" href="/games.nvim/icon.svg" />
    <link rel="manifest" href="/games.nvim/manifest.json" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Sudoku</h1>
      <p class="subtitle">Playable puzzles solved with BILP + GLPK.js</p>

      <div id="status" class="status">Loading solver…</div>

      <div id="grid" class="grid"></div>

      <div class="toolbar">
        <div class="toolbar-row">
          <button id="pencil-mode" class="tool-btn" title="Toggle pencil marks">✏️ Pencil</button>
          <button id="erase" class="tool-btn" title="Erase selected cell">⌫ Erase</button>
        </div>
        <div class="numpad">
          <button data-num="1">1</button>
          <button data-num="2">2</button>
          <button data-num="3">3</button>
          <button data-num="4">4</button>
          <button data-num="5">5</button>
          <button data-num="6">6</button>
          <button data-num="7">7</button>
          <button data-num="8">8</button>
          <button data-num="9">9</button>
        </div>
      </div>

      <div class="controls">
        <button id="generate" disabled>New Puzzle</button>
        <button id="restart" disabled>Restart</button>
        <button id="show-solution" disabled>Show Solution</button>
        <button id="hide-solution" disabled>Hide Solution</button>
      </div>

      <div class="info">
        <span id="clue-count"></span>
        <span id="solve-time"></span>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
